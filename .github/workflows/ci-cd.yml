name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels a running CI, but a running deploy is never cancelled halfway.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - name: Start MongoDB
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.runCommand({ping:1}).ok" >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs mongo; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src test
      - name: Tests (unit + MongoDB integration)
        run: npx vitest run
      - name: Build
        run: npx next build

  deploy:
    # Only after CI passed, only for pushes to main (never for pull requests).
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH and production env
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          set -eu
          for v in DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS ENV_PRODUCTION; do
            eval "[ -n \"\${$v}\" ]" || { echo "::error::secret $v is not set"; exit 1; }
          done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/aral_ministudio
          chmod 600 ~/.ssh/aral_ministudio
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$ENV_PRODUCTION" > .env.production
          chmod 600 .env.production
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: sh deploy/deploy.sh
